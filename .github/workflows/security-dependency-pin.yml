name: Security dependency pin

on:
  push:
    branches: [security-hardening]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: security-dependency-pin
  cancel-in-progress: true

jobs:
  pin-next:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: security-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - name: Pin patched Next.js release
        run: npm install --save-exact next@16.3.3 eslint-config-next@16.3.3
      - name: Commit dependency update
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package.json package-lock.json; then
            echo 'Next.js dependency pin already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'security: upgrade Next.js to patched 16.3.3'
          git push origin HEAD:security-hardening

name: Refresh security lockfile

on:
  push:
    branches: [security-hardening]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-security-lock
  cancel-in-progress: true

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: security-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - name: Regenerate lockfile from patched package policy
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify high severity audit
        run: npm audit --audit-level=high
      - name: Commit lockfile
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo 'No lockfile changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'security: refresh patched dependency lockfile'
          git push origin HEAD:security-hardening

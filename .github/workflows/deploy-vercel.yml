name: Deploy to Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    if: ${{ secrets.VERCEL_TOKEN != '' }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_7in0GW2ShIL0qU6i3mX2zacu
      VERCEL_PROJECT_ID: prj_1sh8a43VccEyVzRJcXcrwEGbZp5Z
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull Vercel environment
        run: npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build Vercel production artifact
        run: npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt artifact
        run: npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
